name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    uses: "getpelican/pelican/.github/workflows/github_pages.yml@2e9a6647a5c1f007c946b740c4b902d49cfb82a6"
    permissions:
      contents: "read"
      pages: "write"
      id-token: "write"
    with:
      settings: "publishconf.py" # Optional: specify your publish settings file
      theme: "https://github.com/alexandrevicenzi/Flex"
      requirements: "-r requirements.txt"
